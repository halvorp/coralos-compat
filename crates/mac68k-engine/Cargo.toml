[package]
name = "mac68k-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Classic Mac OS 68k personality (skeleton): A-line trap bridge, Pascal-convention Toolbox calls onto GuestUi"

[dependencies]
retro-common = { path = "../retro-common" }
retro-guest-mem = { path = "../retro-guest-mem" }
retro-m68k = { path = "../retro-m68k" }
retro-resfork = { path = "../retro-resfork" }
guestui-abi = { path = "../guestui-abi" }
retro-present = { path = "../retro-present" }
retro-raster = { path = "../retro-raster" }
retro-translate = { path = "../retro-translate" }

[dev-dependencies]
mac68k-engine = { path = ".", features = ["fixtures"] }

[features]
# The built-in fixture applications and the dialog test script. Off for the product library (CoralOS user mode); the
# tests and the `mac68k-run` / `mac68k-oracle` CLIs turn it on (the same split as macppc-engine).
fixtures = []

[[bin]]
name = "mac68k-run"
path = "src/bin/mac68k-run.rs"
required-features = ["fixtures"]

[[bin]]
name = "mac68k-oracle"
path = "src/bin/mac68k-oracle.rs"
required-features = ["fixtures"]
