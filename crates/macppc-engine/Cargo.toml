[package]
name = "macppc-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Classic Mac OS PowerPC personality (plumbing): CFM instantiation of PEF fragments, import binding by symbol name onto the mac68k Toolbox handlers (Mixed Mode seam)"

[dependencies]
retro-common = { path = "../retro-common" }
retro-guest-mem = { path = "../retro-guest-mem" }
retro-pef = { path = "../retro-pef" }
retro-volume = { path = "../retro-volume" }
retro-resfork = { path = "../retro-resfork" }
mac68k-engine = { path = "../mac68k-engine" }
guestui-abi = { path = "../guestui-abi" }
heirloom-gl-abi = { path = "../heirloom-gl-abi" }
retro-ppc = { path = "../retro-ppc" }
libm = "0.2"

[dev-dependencies]
retro-raster = { path = "../retro-raster" }
macppc-engine = { path = ".", features = ["fixtures"] }
mac68k-engine = { path = "../mac68k-engine", features = ["fixtures"] }

[features]
# The test-only PowerPC assembler and the built-in fixture applications. Off for the product library (CoralOS user mode);
# the tests and the `macppc-run` CLI turn it on.
fixtures = []

[[bin]]
name = "macppc-run"
path = "src/bin/macppc-run.rs"
required-features = ["fixtures"]
