[package]
name = "retro-ppc-oracle"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Host-only differential fuzz of retro-ppc against ppc-rs (MIT). Not a dependency of anything; not part of the no_std workspace."

# Its own workspace root: ppc-rs is a std crate (edition 2024, rustc_apfloat), so this crate must stay out of the
# no_std `cargo check --workspace --target x86_64-unknown-none` matrix. The root Cargo.toml `exclude`s it.
[workspace]

[dependencies]
retro-ppc = { path = "../retro-ppc" }
retro-guest-mem = { path = "../retro-guest-mem" }
# The oracle: MIT, benletchford/ppc-rs 0.7.2 as published on crates.io.
ppc = "=0.7.2"
