[package]
name = "heirloom-cpu-ppc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PowerPC 32-bit user-mode interpreter (601/603/G3 user instruction set) for heirloom-compat engines"

[dependencies]
# The CPU contract: Trap and the cpu-ppc.library records (heirloom_cpu_abi::ppc) are defined there once; src/table.rs serves the table.
heirloom-cpu-abi = { path = "../heirloom-cpu-abi" }
heirloom-mem-flat32 = { path = "../heirloom-mem-flat32" }
# MIT/Apache-2.0: correctly rounded fma and sqrt for no_std (core has neither on stable).
libm = "0.2"

[features]
# HostCodeMem: Linux executable memory (raw mmap/mprotect) for tier 2 on the HOST only (tests, ppc-bench, the WC3 harness).
# Never enabled by cpu-ppc.library: CoralOS code must not carry Linux syscalls; its provider comes from macppc.engine.
host-codemem = []

[dev-dependencies]
# the integration tests (tests/tier2.rs) run tier 2 in host executable memory
heirloom-cpu-ppc = { path = ".", features = ["host-codemem"] }
