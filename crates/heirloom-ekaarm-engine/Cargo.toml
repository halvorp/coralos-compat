[package]
name = "heirloom-ekaarm-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Heirloom's Symbian EKA2 (ARM) engine: loads an E32 executable, binds its imports to named native calls and runs it on heirloom-cpu-arm"

[dependencies]
heirloom-cpu-arm = { path = "../heirloom-cpu-arm", optional = true }
heirloom-cpu-arm-client = { path = "../heirloom-cpu-arm-client", optional = true }
heirloom-fmt-e32 = { path = "../heirloom-fmt-e32" }
heirloom-mem-paged32 = { path = "../heirloom-mem-paged32" }
heirloom-fmt-rsc = { path = "../heirloom-fmt-rsc" }
heirloom-volume = { path = "../heirloom-volume" }
heirloom-ui-abi = { path = "../heirloom-ui-abi" }
heirloom-common = { path = "../heirloom-common" }
# `os-library`: the os-eka.library table (src/os_face.rs) - heirloom-os-abi's machine session over this machine.
heirloom-os-abi = { path = "../heirloom-os-abi", features = ["serve"], optional = true }

[features]
# The CPU backend (src/cpu.rs): the static core by default; `cpu-library` drives cpu-arm.library through its table.
default = ["cpu-static"]
cpu-static = ["dep:heirloom-cpu-arm"]
cpu-library = ["dep:heirloom-cpu-arm-client"]
# os-eka.library: this machine behind heirloom-os-abi's OsVTable, on cpu-arm.library (never the static core).
os-library = ["cpu-library", "dep:heirloom-os-abi"]
# The test hooks (loader::bare, Process::map_code / map_data) map arbitrary guest code and widen the range the vtable-anchor
# check accepts: only this crate's own tests turn them on (the dev-dependency below), never a consumer.
test-hooks = []
# The std host side (hostdir: a host directory as a guest drive) for the runner and the tests; the engine is no_std.
host = []

[dev-dependencies]
heirloom-ekaarm-engine = { path = ".", features = ["test-hooks", "host"] }
# tests/os_face.rs binds the static core's table as the CPU os-eka.library runs on (a host test; the product binds cpu-arm.library).
heirloom-cpu-arm = { path = "../heirloom-cpu-arm" }
heirloom-cpu-abi = { path = "../heirloom-cpu-abi" }

[[bin]]
name = "ekaarm-run"
path = "src/bin/ekaarm-run.rs"
required-features = ["host"]
