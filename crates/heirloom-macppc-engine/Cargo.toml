[package]
name = "heirloom-macppc-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Classic Mac OS PowerPC personality (plumbing): CFM instantiation of PEF fragments, import binding by symbol name onto the mac68k Toolbox handlers (Mixed Mode seam)"

[dependencies]
heirloom-common = { path = "../heirloom-common" }
heirloom-mem-flat32 = { path = "../heirloom-mem-flat32" }
heirloom-fmt-pef = { path = "../heirloom-fmt-pef" }
heirloom-volume = { path = "../heirloom-volume" }
heirloom-fmt-resfork = { path = "../heirloom-fmt-resfork" }
heirloom-mac68k-engine = { path = "../heirloom-mac68k-engine" }
heirloom-ui-abi = { path = "../heirloom-ui-abi" }
heirloom-gl-abi = { path = "../heirloom-gl-abi" }
heirloom-cpu-ppc = { path = "../heirloom-cpu-ppc", optional = true }
heirloom-cpu-ppc-client = { path = "../heirloom-cpu-ppc-client", optional = true }
# `os-library`: os-mac.library's table (src/os_face.rs) - both Mac families behind heirloom-os-abi's OsVTable v2.
heirloom-os-abi = { path = "../heirloom-os-abi", features = ["serve"], optional = true }
libm = "0.2"

[dev-dependencies]
# tests and the macppc-run CLI drive the static core directly (lockstep, census)
heirloom-cpu-ppc = { path = "../heirloom-cpu-ppc" }
heirloom-raster = { path = "../heirloom-raster" }
heirloom-macppc-engine = { path = ".", default-features = false, features = ["fixtures"] }
heirloom-mac68k-engine = { path = "../heirloom-mac68k-engine", features = ["fixtures"] }

[features]
# The CPU backend (src/lib.rs `cpu`): the static core by default; `cpu-library` drives cpu-ppc.library through its PpcVTable
# (the same split as heirloom-mac68k-engine's cpu-static / cpu-library).
default = ["cpu-static"]
cpu-static = ["dep:heirloom-cpu-ppc"]
cpu-library = ["dep:heirloom-cpu-ppc-client"]
# os-mac.library: the 68k Mac (heirloom-mac68k-engine `os-library`, on cpu-68k.library) and this PowerPC Mac (on cpu-ppc.library)
# behind one OsVTable v2 - never a static core.
os-library = ["cpu-library", "dep:heirloom-os-abi", "heirloom-mac68k-engine/os-library"]
# The test-only PowerPC assembler and the built-in fixture applications. Off for the product library (CoralOS user mode);
# the tests and the `macppc-run` CLI turn it on.
fixtures = ["dep:heirloom-cpu-ppc"]

[[bin]]
name = "macppc-run"
path = "src/bin/macppc-run.rs"
required-features = ["fixtures"]
