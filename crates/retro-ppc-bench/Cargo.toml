[package]
name = "retro-ppc-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Host-only benchmark of the retro-ppc execution tiers: synthetic PowerPC workloads, the Retro68 samples and corpus applications (skipped when absent). Not a dependency of anything; not part of the no_std workspace."

# Its own workspace root (a std binary must stay out of the no_std `cargo check --workspace --target x86_64-unknown-none`
# matrix), like retro-ppc-oracle. The root Cargo.toml `exclude`s it.
[workspace]

[dependencies]
retro-ppc = { path = "../retro-ppc" }
retro-guest-mem = { path = "../retro-guest-mem" }
retro-pef = { path = "../retro-pef" }
guestui-abi = { path = "../guestui-abi" }
macppc-engine = { path = "../macppc-engine" }

[profile.release]
debug = 1

[[bin]]
name = "ppc-bench"
path = "src/main.rs"
